{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h5>
                {% if thread.eclass %}{{ thread.eclass.name }}{% else %}Private Chat{% endif %}
            </h5>
        </div>
        <div class="card-body" style="height: 400px; overflow-y: scroll;" id="chat-log">
            {% for message in messages %}
                <div class="mb-2 {% if message.sender == user %}text-end{% endif %}">
                    <span class="badge {% if message.sender == user %}bg-primary{% else %}bg-secondary{% endif %}">
                        {{ message.sender.username }}
                    </span>
                    <div class="p-2 rounded {% if message.sender == user %}bg-light text-dark d-inline-block{% else %}bg-dark text-white d-inline-block{% endif %}">
                        {{ message.text }}
                    </div>
                </div>
            {% endfor %}
        </div>
        <div class="card-footer">
            <div class="input-group">
                <input type="text" id="chat-message-input" class="form-control" placeholder="Type message...">
                <button class="btn btn-primary" id="chat-message-submit">Send</button>
            </div>
        </div>
    </div>
</div>

{{ thread.id|json_script:"thread-id" }}
<script>
    const threadId = JSON.parse(document.getElementById('thread-id').textContent);
    
    // Determine if we are using https or http to switch to wss or ws
    const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
    const chatSocket = new WebSocket(
        wsScheme + '://' + window.location.host + '/ws/chat/' + threadId + '/'
    );

    const chatLog = document.getElementById('chat-log');

    // Receive message from server
    chatSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        const messageElement = document.createElement('div');
        messageElement.className = data.sender === '{{ user.username }}' ? 'text-end mb-2' : 'mb-2';
        
        messageElement.innerHTML = `
            <span class="badge ${data.sender === '{{ user.username }}' ? 'bg-primary' : 'bg-secondary'}">${data.sender}</span>
            <div class="p-2 rounded ${data.sender === '{{ user.username }}' ? 'bg-light text-dark d-inline-block' : 'bg-dark text-white d-inline-block'}">
                ${data.message}
            </div>
        `;
        
        chatLog.appendChild(messageElement);
        // Scroll to bottom
        chatLog.scrollTop = chatLog.scrollHeight;
    };

    chatSocket.onclose = function(e) {
        console.error('Chat socket closed unexpectedly');
    };

    // Send message to server
    document.querySelector('#chat-message-submit').onclick = function(e) {
        const messageInputDom = document.querySelector('#chat-message-input');
        const message = messageInputDom.value;
        chatSocket.send(JSON.stringify({
            'message': message
        }));
        messageInputDom.value = '';
    };

    // Allow Enter key to send
    document.querySelector('#chat-message-input').focus();
    document.querySelector('#chat-message-input').onkeyup = function(e) {
        if (e.key === 'Enter') {
            document.querySelector('#chat-message-submit').click();
        }
    };
</script>
{% endblock %}
